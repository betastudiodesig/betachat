
name: Extraer proyecto Android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Extraer proyecto
        run: |
          test -f BetaChat-GitHub-Project.zip
          mkdir -p /tmp/betachat
          unzip -o BetaChat-GitHub-Project.zip -d /tmp/betachat
          cp -a /tmp/betachat/BetachatProject/. .

      - name: Guardar archivos extraidos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Añadir proyecto Android BetaChat"
            git push
          fi
