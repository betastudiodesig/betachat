name: Compilar BetaChat Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'BetaChat-GitHub-Project.zip'
      - '.github/workflows/compilar-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extraer ZIP del proyecto
        run: |
          test -f BetaChat-GitHub-Project.zip
          mkdir -p extracted
          unzip -q -o BetaChat-GitHub-Project.zip -d extracted
          test -f extracted/BetachatProject/settings.gradle.kts

      - name: Compilar APK debug
        run: gradle --no-daemon --stacktrace -p extracted/BetachatProject assembleDebug

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: BetaChat-Android-APK
          path: extracted/BetachatProject/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
